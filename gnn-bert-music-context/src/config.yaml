seed: 42

audio:
  sample_rate: 22050
  n_mels: 128
  n_chroma: 12
  segment_seconds: 5

text:
  max_length: 128
  vocab_size: 8000
  embed_dim: 128
  n_layers: 4
  n_heads: 4

gnn:
  hidden_dim: 128
  n_layers: 2
  dropout: 0.2

fusion:
  hidden_dim: 128
  n_heads: 4

contrastive:
  temperature: 0.07
  embed_dim: 128

training:
  batch_size: 16
  lr: 0.001
  epochs: 5

paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  results: results